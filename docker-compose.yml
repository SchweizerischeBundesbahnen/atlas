      - "5443:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: location
    volumes:
      - "/var/lib/postgresql/data"
    command:
      - "postgres"
      - "-c"
      - "datestyle=iso, ymd"

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: &kafka-image apache/kafka:4.0.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    depends_on:
      - zookeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:9094,CONTROLLER://kafka:9093,
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181

    healthcheck:
      test: [ "CMD", "bash", "-lc", "./opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: *kafka-image
    working_dir: /opt/kafka/bin
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      '
      set -e
      echo "Creating topics.."
      ./kafka-topics.sh --create --if-not-exists --topic atlas.mail --replication-factor=1 --partitions=1 --bootstrap-server kafka:9094
      ./kafka-topics.sh --create --if-not-exists --topic atlas.user.administration --replication-factor=1 --partitions=1 --bootstrap-server kafka:9094
      ./kafka-topics.sh --create --if-not-exists --topic atlas.business.organisation --replication-factor=1 --partitions=1 --bootstrap-server kafka:9094
      ./kafka-topics.sh --create --if-not-exists --topic atlas.transport.company --replication-factor=1 --partitions=1 --bootstrap-server kafka:9094
      ./kafka-topics.sh --create --if-not-exists --topic atlas.service.point --replication-factor=1 --partitions=1 --bootstrap-server kafka:9094
      echo "Topics succsessfully created"
      '

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    healthcheck:
      test: curl -s http://localhost:9000/minio/health/live || exit 1
      timeout: 5s
      start_period: 5s
      start_interval: 1s

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-minio.sh:/init-minio.sh
    environment:
      MINIO_SERVER_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: /bin/bash -c "/init-minio.sh"

  wiremock:
    build:
      context: ./wiremock
      dockerfile: Dockerfile
    ports:
      - "8666:8080"