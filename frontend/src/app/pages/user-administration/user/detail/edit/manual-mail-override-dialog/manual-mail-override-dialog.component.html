<div class="dialog-close-panel dialog-close-icon-container">
  <button [mat-dialog-close]="undefined" class="close-icon-btn">
    <em class="bi bi-x fs-2"></em>
  </button>
</div>
<div class="dialog" data-cy="manual-mail-dialog">
  <div class="font-bold-2xl">
    {{ data.title | translate }}
  </div>
  <div>
    {{ 'USER_ADMIN.MANUAL_MAIL_DIALOG.HINT' | translate }}
  </div>

  <div class="d-inline-flex mt-2">
    <div class="d-flex me-3 font-bold-base"> {{ 'USER_ADMIN.MANUAL_MAIL_DIALOG.AZURE_MAIL' | translate }}: </div>
    <div class="d-flex" data-cy="azure-mail">{{ azureMail }}</div>
  </div>

  <div class="mt-2">
    <atlas-text-field
      [formGroup]="form"
      controlName="manualMail"
      data-cy="manual-mail-input"
      fieldLabel="USER_ADMIN.MANUAL_MAIL"
      placeholder="USER_ADMIN.MANUAL_MAIL"
    />
  </div>

  <mat-dialog-actions class="justify-content-center">
    <atlas-button
      buttonType="cancel"
      (buttonClicked)="cancel()"
      class="me-3"
      data-cy="dialog-cancel-button"
      buttonText="COMMON.CANCEL" />
    @if (hasExistingOverride) {
      <atlas-button
        buttonType="delete"
        (buttonClicked)="delete()"
        class="me-3"
        data-cy="dialog-delete-button"
        buttonText="COMMON.DELETE"
      />
    }
    <atlas-button
      buttonType="confirm"
      (buttonClicked)="confirm()"
      [disabled]="form.invalid"
      data-cy="dialog-confirm-button"
      buttonText="COMMON.SAVE"
  /></mat-dialog-actions>
</div>
