<atlas-table
  (editElementEvent)="openUser($event)"
  (tableChanged)="reloadTableWithCurrentSettings()"
  (tableInitialized)="reloadTableWithCurrentSettings()"
  [showTableFilter]="false"
  [pageSizeOptions]="[5, 10, 20]"
  [sortingDisabled]="true"
  [tableColumns]="tableColumns"
  [tableData]="userPageResult.users"
  [totalCount]="userPageResult.totalCount"
>
  <div class="d-flex flex-column mb-1">
    <mat-label class="font-bold-lg">{{ 'COMMON.SEARCH.SEARCH_FOR' | translate }} </mat-label>
    <mat-radio-group (change)="selectedSearchChanged()" [(ngModel)]="selectedSearch">
      @for (option of searchOptions; track option) {
        <mat-radio-button [value]="option.value" class="pe-2">
          {{ option.translationKey | translate }}
        </mat-radio-button>
      }
    </mat-radio-group>
  </div>

  <div class="col-12 search-section-height">
    @if (selectedSearch === 'USER') {
      <div class="mb-1">
        <mat-label class="font-bold-lg">{{ 'USER_ADMIN.TABLE_HEADER' | translate }} </mat-label>
      </div>
      <atlas-user-select (selectionChange)="onUserFilterChanged($event)" [form]="userSearchForm" />
    } @else if (selectedSearch === 'FILTER') {
      <div class="d-flex flex-row">
        <atlas-bo-select
          (boSelectionChanged)="filterChanged()"
          [controlName]="boSearchCtrlName"
          [formGroup]="boForm"
          [formModus]="false"
          class="col-5 pe-1"
        />

        <div class="d-flex flex-column col-5 ps-3">
          <atlas-select
            (selectChanged)="applicationChanged($event.value); filterChanged()"
            [value]="selectedApplicationOptions"
            label="USER_ADMIN.APPLICATIONS"
            [additionalLabelspace]="0"
            optionTranslateLabelPrefix="USER_ADMIN.APPLICATION."
            [options]="applicationBoOptions"
            [multiple]="true"
          />
        </div>

        <div class="d-flex flex-column col-2 ps-3 justify-content-end">
          <button
            class="atlas-primary-btn"
            [disabled]="copyingEmails || userPageResult.totalCount === 0 || !hasFilterCriteria"
            (click)="copyFilteredEmails()"
          >
            {{ 'USER_ADMIN.COPY_EMAILS' | translate }}
          </button>
        </div>
      </div>
    } @else {
      <div class="d-flex flex-row">
        <div class="d-flex flex-column col-5 ps-1">
          <atlas-select
            (selectChanged)="cantonChanged($event.value); filterChanged()"
            [value]="selectedCantonOptions"
            label="COMMON.CANTONS"
            [additionalLabelspace]="0"
            [optionTranslateLabelPrefix]="SWISS_CANTONS_PREFIX_LABEL"
            [options]="cantonOptions"
            [multiple]="true"
            [displayExtractor]="getCantonAbbreviation"
          />
        </div>

        <div class="d-flex flex-column col-5 ps-3">
          <atlas-select
            (selectChanged)="applicationChanged($event.value); filterChanged()"
            [value]="selectedApplicationOptions"
            label="USER_ADMIN.APPLICATIONS"
            [additionalLabelspace]="0"
            optionTranslateLabelPrefix="USER_ADMIN.APPLICATION."
            [options]="applicationCantonOptions"
            [multiple]="true"
          />
        </div>

        <div class="d-flex flex-column col-2 ps-3 justify-content-end">
          <button
            class="atlas-primary-btn"
            [disabled]="copyingEmails || userPageResult.totalCount === 0 || !hasFilterCriteria"
            (click)="copyFilteredEmails()"
          >
            {{ 'USER_ADMIN.COPY_EMAILS' | translate }}
          </button>
        </div>
      </div>
    }
  </div>
</atlas-table>
<router-outlet />
