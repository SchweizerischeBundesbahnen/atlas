<atlas-detail-page-container>
  <div class="font-bold-4xl detail-title mb-3">
    {{ selectedVersion.designationOfficial }}
  </div>
  <div class="font-xl mb-2">
    <span data-cy="total-range">
      <atlas-date-range-text [dateRange]="maxValidity"></atlas-date-range-text>
    </span>
  </div>
  <div class="d-flex flex-row mb-3">
    <atlas-sloid-container [sloid]="selectedVersion.sloid!"></atlas-sloid-container>
    <div class="d-flex flex-column ms-5" data-cy="selected-version-number">
      <div class="font-bold-base">
        {{ 'SEPODI.SERVICE_POINTS.DIDOK_CODE' | translate }}
      </div>
      <div class="d-flex"
        >{{ selectedVersion.number | splitServicePointNumber }}
        <atlas-clipboard [value]="selectedVersion.number!.number.toString()" [showMe]="true"></atlas-clipboard>
      </div>
    </div>
  </div>

  <nav mat-tab-nav-bar class="tabs mt-5" data-cy="tabs" [tabPanel]="tabPanel">
    @for (tab of tabs; track tab) {
      <a
        mat-tab-link
        class="font-bold-xl"
        [routerLink]="tab.link"
        routerLinkActive="active-tab"
        [attr.data-cy]="'tab-' + tab.link"
      >
        {{ tab.title | translate }}
      </a>
    }
  </nav>
  <div class="tab-content">
    <mat-tab-nav-panel #tabPanel>
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  </div>
</atlas-detail-page-container>
