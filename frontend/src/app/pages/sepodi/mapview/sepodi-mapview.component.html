<atlas-search-service-point-panel [searchType]="servicePointSearchType" (toggleEvent)="showPanel()">
  <atlas-button
    (buttonClicked)="routeToNewSP()"
    applicationType="SEPODI"
    buttonDataCy="new-service-point-button"
    buttonText="SEPODI.SERVICE_POINTS.NEW_SERVICE_POINT"
    buttonType="createCheckingPermission"
    wrapperStyleClass="ps-4 pt-2"
    ><i class="bi bi-plus"></i
  ></atlas-button>
</atlas-search-service-point-panel>

<div [ngClass]="showSearchPanel ? 'search-open' : 'search-close'" class="page-with-map">
  <div #detailContainer class="detail-container">
    <router-outlet (activate)="setRouteActive(true)" (deactivate)="setRouteActive(false)" />
  </div>
  <atlas-map class="map-container" [isSidePanelOpen]="isSidePanelOpen" />
</div>
