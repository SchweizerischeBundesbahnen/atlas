@if (existingDecision()?.fotJudgement || isSepodiSupervisor) {
  <div class="override-section" [formGroup]="formGroup">
    <div class="font-bold-4xl mt-5">
      {{ 'SEPODI.SERVICE_POINTS.WORKFLOW.OVERRIDE_TITLE' | translate }}
    </div>

    <div class="mt-3 d-flex justify-content-between">
      <div class="col-5" [title]="formGroup.controls.firstName.value ?? ''">
        <atlas-text-field
          [formGroup]="formGroup"
          [required]="true"
          controlName="firstName"
          fieldLabel="WORKFLOW.PERSON.FIRSTNAME"
        />
      </div>
      <div class="col-5" [title]="formGroup.controls.lastName.value ?? ''">
        <atlas-text-field
          [formGroup]="formGroup"
          [required]="true"
          controlName="lastName"
          fieldLabel="WORKFLOW.PERSON.LASTNAME"
        />
      </div>
    </div>

    <mat-radio-group formControlName="fotJudgement" class="d-grid">
      <mat-radio-button [value]="JudgementType.Yes">
        {{ 'WORKFLOW.DECISION.OVERRIDE_ACCEPT' | translate }}
      </mat-radio-button>
      <mat-radio-button [value]="JudgementType.No">
        {{ 'WORKFLOW.DECISION.OVERRIDE_DECLINE' | translate }}
      </mat-radio-button>
      <atlas-field-error [control]="formGroup.get('fotJudgement')" />
    </mat-radio-group>

    <div class="mt-3">
      <atlas-comment
        [formGroup]="formGroup"
        [label]="'SEPODI.SERVICE_POINTS.WORKFLOW.COMMENT' | translate"
        controlName="fotMotivation"
        [required]="true"
      />
    </div>
  </div>
}
