<div class="ps-5 pt-5">
  @if (!isHearingYearPlanned()) {
    <nav [tabPanel]="tabPanelCanton" class="tabs" data-cy="tabs" mat-tab-nav-bar>
      @for (tab of TABS; track tab) {
        <a
          [attr.data-cy]="'tth-tab-' + tab.link"
          [routerLink]="[this.hearingStatus().toLowerCase(), tab.link]"
          queryParamsHandling="preserve"
          [relativeTo]="route"
          routerLinkActive="active-tab"
          class="font-bold-xl"
          mat-tab-link
        >
          {{ tab.title | translate }}
        </a>
      }
    </nav>
  }

  <div [ngClass]="!isHearingYearPlanned() ? 'white-table-container-no-padding' : ''">
    <mat-tab-nav-panel #tabPanelCanton>
      <router-outlet />
    </mat-tab-nav-panel>
  </div>
</div>
