<div class="dialog-close-panel dialog-close-icon-container">
  <button [mat-dialog-close]="false" class="close-icon-btn">
    <em class="bi bi-x fs-2"></em>
  </button>
</div>
<div class="dialog" data-cy="dialog">
  <div class="font-bold-2xl">
    {{ 'TTH.DOSSIER.STATEMENT_SELECT.CURRENT_STATEMENTS' | translate }}
  </div>
  <atlas-statement-select [(selectedStatements)]="selectedStatements"></atlas-statement-select>
  <atlas-spacer [divider]="true"></atlas-spacer>
  <div class="font-bold-2xl mt-5">
    {{ 'TTH.DOSSIER.STATEMENT_SELECT.ADDITIONAL_STATEMENTS' | translate }}
  </div>
  <atlas-table
    (buttonClickEvent)="addStatement($event)"
    (editElementEvent)="addStatement($event)"
    (tableChanged)="getAdditionalStatements($event)"
    (tableInitialized)="getAdditionalStatements($event)"
    [tableColumns]="tableColumns"
    [tableData]="statements"
    [totalCount]="totalCount$"
    [tableFilterConfig]="tableFilterConfig"
    data-cy="tthTable"
  ></atlas-table>
  <mat-dialog-actions class="justify-content-end flex-nowrap">
    <atlas-button
      buttonType="cancel"
      (buttonClicked)="cancel()"
      class="me-3"
      data-cy="dialog-cancel-button"
      [buttonText]="data.cancelText!"
    >
    </atlas-button>
    <atlas-button
      buttonType="confirm"
      (buttonClicked)="confirm()"
      data-cy="dialog-confirm-button"
      [buttonText]="data.confirmText!"
    >
    </atlas-button>
  </mat-dialog-actions>
</div>
