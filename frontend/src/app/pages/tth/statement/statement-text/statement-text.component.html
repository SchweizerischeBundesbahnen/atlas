<ng-container [formGroup]="form()">
  <h1 class="font-bold-xl pt-2">
    {{ 'TTH.STATEMENT.CITIZEN_CONCERN' | translate }}
    <atlas-spacer [divider]="true" height="10px"></atlas-spacer>
  </h1>

  <div class="flex-row mb-4">
    <atlas-label-field fieldLabel="TTH.STATEMENT.STATEMENT_TEXT" />

    @if (!statementText.checkboxStatementAnonymous) {
      <div class="d-flex flex-column col-12">
        <atlas-form-comment
          subLabel="TTH.STATEMENT.ANONYMOUS_STATEMENT"
          [formGroup]="form()"
          [displayLabel]="true"
          label=""
          controlName="anonymousStatement"
        >
        </atlas-form-comment>
      </div>
    }
    @if (statementText.showOriginalTextButton) {
      <atlas-button
        buttonDataCy="showOriginalStatementText"
        [buttonText]="statementText.originalTextButtonLabel"
        buttonType="icon"
        (buttonClicked)="showOriginalText()"
        wrapperStyleClass="pt-1"
        buttonStyleClass="atlas-icon-btn font-bold-base"
      >
        <ng-template #rightIcon>
          <i class="bi {{ statementText.originalTextButtonIcon }} h5"></i>
        </ng-template>
      </atlas-button>
    }
    @if (statementText.showOriginalStatementText) {
      <div class="pt-2 d-flex flex-column col-12">
        <atlas-form-comment
          subLabel="TTH.STATEMENT.ORIGINAL_STATEMENT"
          [formGroup]="form()"
          [displayLabel]="true"
          label=""
          controlName="statement"
        >
        </atlas-form-comment>
      </div>
    }
  </div>
</ng-container>
