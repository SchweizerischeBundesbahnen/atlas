<div class="dialog-close-panel dialog-close-icon-container">
  <button [mat-dialog-close]="false" class="close-icon-btn">
    <em class="bi bi-x fs-2"></em>
  </button>
</div>
<div class="dialog" data-cy="dialog">
  <div class="mb-5">
    <span class="font-bold-4xl">{{ data.title | translate }}</span>
    <div class="mb-2">
      <br />
    </div>
    @if (data.type === 'SINGLE') {
      <span class="font-regular-lg message">{{ data.message | translate }}</span>
    }
    @if (!data.type || data.type === 'MULTIPLE') {
      <span class="font-regular-lg message">{{ data.message | translate: { tthsLength: data.tths.length } }}</span>
    }
  </div>
  <ng-content />
  <div class="pt-2 pb-5 comment">
    <atlas-form-comment
      [formGroup]="formGroup"
      controlName="{{ controlName }}"
      label="TTH.DIALOG.COMMENT_LABEL"
      maxChars="{{ maxChars }}"
    />
  </div>
  <mat-dialog-actions class="justify-content-end">
    <button (click)="closeDialog()" class="atlas-primary-btn me-3" data-cy="dialog-cancel-button">
      {{ data.cancelText ?? 'DIALOG.CANCEL' | translate }}
    </button>
    <button (click)="changeEvent.emit()" class="atlas-primary-btn primary-color-btn" data-cy="dialog-confirm-button">
      {{ data.confirmText ?? 'DIALOG.OK' | translate }}
    </button>
  </mat-dialog-actions>
</div>
