<div class="ps-5 pt-5">
  <atlas-button
    buttonType="createCheckingPermission"
    applicationType="TTFN"
    buttonDataCy="new-item"
    (buttonClicked)="newVersion()"
    buttonText="TTFN.NEW"
  />

  <div class="white-table-container-no-tabs mt-5">
    <div class="table-heading font-bold-4xl color-gray-900 mb-5">
      {{ 'PAGES.TTFN.TITLE_HEADER' | translate }}
    </div>

    <atlas-table
      data-cy="ttfn"
      [tableData]="timetableFieldNumbers"
      [totalCount]="totalCount$"
      [tableColumns]="tableColumns"
      [tableFilterConfig]="tableFilterConfig"
      (editElementEvent)="editVersion($event)"
      (tableChanged)="getOverview($event)"
      (tableInitialized)="getOverview($event)"
    />
    <router-outlet />
  </div>
</div>
