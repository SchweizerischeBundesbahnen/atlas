<div class="prm-panel-container">
  <atlas-search-service-point-panel
    [searchType]="servicePointSearch"
    (toggleEvent)="showPanel()"
  ></atlas-search-service-point-panel>
  @if (isPrmHome) {
    <div class="col-12 d-flex">
      <div class="info-box-container">
        <atlas-prm-info-box></atlas-prm-info-box>
      </div>
    </div>
  }
</div>
<div [ngClass]="showSearchPanel ? 'router-container' : 'router-container-close'">
  <router-outlet></router-outlet>
</div>
