<atlas-detail-page-content>
  @if (isNew) {
    <div class="font-bold-3xl mb-3">
      {{ 'PRM.TOILETS.NEW' | translate }}
    </div>
  }
  @if (isNew) {
    <div class="new-sloid d-flex flex-column">
      <atlas-sloid [formGroup]="form" [givenPrefix]="servicePoint.sloid + ':'" [numberColons]="0" />
    </div>
  }
  @if (showVersionSwitch) {
    <div class="col-12 d-flex mt-3 mb-5">
      <div class="d-flex flex-column col-8 pe-3">
        <atlas-switch-version
          (switchVersion)="switchVersion($event)"
          [currentRecord]="selectedVersion"
          [records]="versions"
          [showStatus]="false"
        />
      </div>
    </div>
  }

  @if (!isNew) {
    <h2 class="font-bold-2xl color-gray-900">
      {{ 'PRM.TOILETS.DETAIL_INFORMATION' | translate }} -
      {{ 'COMMON.VERSION' | translate }}
      {{ selectedVersionIndex + 1 }}
    </h2>
  }

  <atlas-toilet-form [form]="form" />
  @if (!isNew) {
    <div>
      <mat-divider class="mt-4 mb-4" />
      <atlas-user-detail-info [record]="selectedVersion" [applicationType]="'PRM'" />
    </div>
  }
</atlas-detail-page-content>
<atlas-detail-footer>
  <atlas-button
    (buttonClicked)="back()"
    [disabled]="false"
    [footerEdit]="form.enabled"
    buttonDataCy="back"
    buttonText="COMMON.BACK"
    buttonType="whiteFooterNonEdit"
  />
  @if (form.disabled) {
    <atlas-button
      (buttonClicked)="toggleEdit()"
      applicationType="PRM"
      [businessOrganisations]="businessOrganisations"
      buttonDataCy="edit"
      buttonText="COMMON.EDIT"
      buttonType="edit-service-point-dependent"
      wrapperStyleClass="ms-3"
    />
  }
  <atlas-button
    (buttonClicked)="toggleEdit()"
    [footerEdit]="form.enabled"
    buttonDataCy="cancel"
    buttonText="COMMON.CANCEL"
    buttonType="whiteFooterEdit"
  />
  <atlas-button
    (buttonClicked)="save()"
    [footerEdit]="form.enabled"
    [disabled]="!form.dirty || saving"
    buttonDataCy="save"
    buttonText="COMMON.SAVE"
    buttonType="whiteFooterEdit"
    wrapperStyleClass="ms-3"
  />
</atlas-detail-footer>
