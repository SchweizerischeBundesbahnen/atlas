@if (!isNew) {
  <div class="font-xl mb-2">
    <span data-cy="total-range">
      <atlas-date-range-text [dateRange]="maxValidity"></atlas-date-range-text>
    </span>
  </div>
}
@if (!isNew) {
  <div class="d-flex flex-row mb-5">
    <atlas-sloid-container [sloid]="selectedVersion.sloid!"></atlas-sloid-container>
  </div>
}
