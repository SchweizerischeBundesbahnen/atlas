<div class="tab-detail-container">
  <div class="d-flex flex-row pe-3 col-12 justify-content-end">
    <atlas-navigation-sepodi-prm targetPage="traffic-point-table" [number]="servicePointVersion.number.number" />
  </div>
  <atlas-table
    data-cy="platform-overview-table"
    [tableData]="platforms"
    [totalCount]="totalCount"
    [tableColumns]="tableColumns"
    [tableFilterConfig]="tableFilterConfig"
    (editElementEvent)="rowClicked($event)"
    (tableChanged)="getOverview($event)"
    (tableInitialized)="getOverview($event)"
  />
</div>
<atlas-detail-footer>
  <atlas-button
    buttonDataCy="close-detail"
    buttonText="SEPODI.BACK_TO_MAP"
    buttonType="whiteFooterNonEdit"
    (buttonClicked)="closeSidePanel()"
    [footerEdit]="false"
  />
</atlas-detail-footer>
