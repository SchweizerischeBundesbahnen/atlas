<mat-toolbar class="home-header bg-color-gray-100">
  <div
    data-cy="atlas-logo-home-link"
    class="d-flex justify-content-center align-items-center logo-placeholder"
    [routerLink]="['/']"
  >
    <div class="d-flex flex-column align-items-center">
      <img ngSrc="assets/images/logo-atlas.svg" priority width="45" height="45" alt="Atlas Logo" />
      <span class="title">atlas</span>
    </div>
  </div>
  <div class="d-flex flex-column header-container color-gray-900">
    @if (headerTitle$ | async; as translationKey) {
      <span data-cy="header-title" class="font-bold-4xl">{{ translationKey | translate }}</span>
    }
    <div class="font-regular-sm">
      <span>Version {{ version }}</span>
      <a href="{{ environmentReleaseNotesUrl }}" target="_blank" rel="noopener">
        <atlas-form-info-icon infoTitle="Release Notes" />
      </a>
      @if (isItWednesday) {
        <div class="d-flex flex-row maintenance-info">
          <atlas-maintenance-icon />
          <span class="ms-2 wrap">{{ 'COMMON.MAINTENANCE_WINDOW' | translate }}</span>
        </div>
      }
    </div>
  </div>
  @if (showLabel) {
    <span [ngClass]="getEnvLabelClass()" class="environment-badge w-100 ms-4 me-3">
      {{ environmentLabel }}
    </span>
  }
  <atlas-language-switcher class="ms-auto" />
  <atlas-user class="ms-4 me-5" />
</mat-toolbar>
