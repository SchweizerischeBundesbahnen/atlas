<div class="font-bold-4xl color-gray-900 mb-5">
  {{ 'PROFILE.PERMISSIONS' | translate }}
</div>

<mat-tab-group
  class="tabs"
  animationDuration="0ms"
  (selectedTabChange)="onSelectedTabChange($event)"
>
  @for (application of applications; track application) {
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="font-bold-xl">
          {{ 'USER_ADMIN.APPLICATION.' + application | translate }}
        </div>
      </ng-template>
      <div class="py-3">
        <atlas-application-permission
          [application]="application"
          [form]="form()"
        >
        </atlas-application-permission>
      </div>
    </mat-tab>
  }
</mat-tab-group>
