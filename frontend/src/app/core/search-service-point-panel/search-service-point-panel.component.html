<div [ngClass]="showSearchPanel ? 'search-container-opened' : 'search-container-closed'" class="search-container">
  @if (!showSearchPanel) {
    <span class="ps-4 pt-2 search-plaintext">{{ 'COMMON.SEARCH.SEARCH_CRITERIA' | translate }}...</span>
  } @else {
    <div class="container-sp-create-and-search">
      @if (searchNavigationType === 'NAVIGATION') {
        <atlas-navigate-service-point [searchNavigationType]="searchNavigationType" [searchType]="searchType()" />
      } @else {
        <atlas-search-service-point [searchType]="searchType()" />
      }

      <div class="font-bold-sm ps-3">
        <span>
          {{ 'SEPODI.SERVICE_POINTS.SEARCH_OR_NAVIGATION' | translate }}
        </span>
        <div class="ps-4 pt-lg-2">
          <atlas-slide-toggle (toggleChange)="changeSearchType($event)" [slideTrackNeutral]="true" />
        </div>
      </div>
      <ng-content />
    </div>
  }
  <div class="button-container">
    <atlas-button
      (buttonClicked)="toggle()"
      buttonType="icon"
      wrapperStyleClass="{{ showSearchPanel ? 'pt-4' : 'pt-1' }} pe-3 pb-1"
    >
      <ng-template #rightIcon>
        <i [ngClass]="showSearchPanel ? 'bi bi-arrow-up-circle' : 'bi bi-arrow-down-circle'"></i>
      </ng-template>
    </atlas-button>
  </div>
</div>
