<div [formGroup]="formGroup">
  <ng-content />
  <ng-select
    #ngSelect
    (change)="changeTrigger.emit($event)"
    [bindValue]="bindValueInp"
    [formControlName]="controlName"
    [items]="(items$ | async) ?? []"
    [minTermLength]="2"
    [multiple]="multiple"
    [placeholder]="placeholderTextKey | translate"
    [readonly]="disabled"
    [typeahead]="searchTrigger"
    appearance="outline"
    notFoundText="{{ 'COMMON.NODATAFOUND' | translate }}"
    typeToSearchText="{{ 'COMMON.TYPE_TO_SEARCH' | translate }}"
  >
    <ng-template let-item="item" ng-label-tmp>
      <ng-container *ngTemplateOutlet="labelOptionTemplates; context: { $implicit: item }" />
    </ng-template>
    <ng-template let-item="item" ng-option-tmp>
      <ng-container *ngTemplateOutlet="labelOptionTemplates; context: { $implicit: item }" />
    </ng-template>
  </ng-select>

  <atlas-field-error [control]="formGroup.get(controlName)" />
</div>
