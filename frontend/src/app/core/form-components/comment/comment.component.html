<div [formGroup]="formGroup()" class="d-flex flex-column">
  @if (displayLabel()) {
    <atlas-label-field
      [fieldExamples]="[
        { label: subLabel(), translate: true },
        { label: ' | ', translate: false },
        {
          label: 'FORM.MAX_CHARS',
          translate: true,
          arg: { key: 'numberOfChars', value: maxChars() },
        },
      ]"
      [required]="required()"
      fieldLabel="{{ label() }}"
      [infoIconTitle]="info()"
    />
  }
  <textarea
    [attr.data-cy]="controlName()"
    formControlName="{{ controlName() }}"
    matInput
    rows="7"
    [readonly]="readonly()"
  ></textarea>
  <atlas-field-error [control]="formGroup().get(controlName())" />
</div>
