<div [formGroup]="formGroup()" class="col-12 d-flex mt-3">
  <div class="d-flex flex-column">
    <atlas-label-field
      [fieldExamples]="
        readonly()
          ? []
          : [
              { label: 'FORM.FOR_EXAMPLE', translate: true },
              { label: ' ', translate: false },
              {
                label: setDateExamples() ? labelExample() : EXAMPLE_DATE,
                translate: true,
              },
            ]
      "
      [required]="required()"
      [fieldLabel]="label()"
      [infoIconTitle]="infoIconTitle()"
    />
    <div class="text-field-flex">
      <input
        [matDatepicker]="datePicker"
        [max]="maxDate()"
        [min]="minDate()"
        [attr.data-cy]="controlName()"
        [formControlName]="controlName()"
      />
      <div>
        <atlas-form-date-icon
          tabindex="0"
          (click)="datePicker.open()"
          (keydown.enter)="datePicker.open()"
          (keydown.space)="datePicker.open()"
          [enabled]="controlFrom.enabled"
        />
        <mat-datepicker #datePicker />
      </div>
    </div>
    <atlas-field-error [control]="formGroup().get(controlName())" />
  </div>
</div>
