<div [formGroup]="formGroup()" class="col-12 d-flex mt-3">
  <div class="d-flex flex-column col-6 pe-3">
    <atlas-label-field
      [fieldExamples]="[
        { label: 'FORM.FOR_EXAMPLE', translate: true },
        { label: ' ', translate: false },
        {
          label: setDateExamples() ? labelFromExample() : EXAMPLE_DATE_FROM,
          translate: true,
        },
      ]"
      [required]="required()"
      [fieldLabel]="labelFrom()"
      [infoIconTitle]="infoIconTitleFrom()"
    />
    <div class="text-field-flex">
      <input
        [matDatepicker]="validFromPicker"
        [max]="MAX_DATE"
        [min]="MIN_DATE"
        [attr.data-cy]="controlNameFrom()"
        [formControlName]="controlNameFrom()"
      />
      <div>
        <atlas-form-date-icon
          tabindex="0"
          (click)="validFromPicker.open()"
          (keydown.enter)="validFromPicker.open()"
          (keydown.space)="validFromPicker.open()"
          [enabled]="controlFrom.enabled"
        />
        <mat-datepicker #validFromPicker [calendarHeaderComponent]="validFromHeader" />
      </div>
    </div>
    <atlas-field-error [control]="formGroup().get(controlNameFrom())" />
  </div>
  <div class="d-flex flex-column col-6 pe-3">
    <atlas-label-field
      [fieldExamples]="[
        { label: 'FORM.FOR_EXAMPLE', translate: true },
        { label: ' ', translate: false },
        {
          label: setDateExamples() ? labelUntilExample() : EXAMPLE_DATE_TO,
          translate: true,
        },
      ]"
      [required]="required()"
      [fieldLabel]="labelUntil()"
      [infoIconTitle]="infoIconTitleUntil()"
    />
    <div class="text-field-flex">
      <input
        [matDatepicker]="validToPicker"
        [max]="MAX_DATE"
        [min]="MIN_DATE"
        [attr.data-cy]="controlNameTo()"
        [formControlName]="controlNameTo()"
        list="validToSuggestions"
      />
      @if (showMaxValidityAutoFill()) {
        <datalist id="validToSuggestions">
          <option value="31.12.9999"></option>
        </datalist>
      }
      <div>
        <atlas-form-date-icon
          tabindex="0"
          (click)="validToPicker.open()"
          (keydown.enter)="validToPicker.open()"
          (keydown.space)="validToPicker.open()"
          [enabled]="controlTo.enabled"
        />
        <mat-datepicker #validToPicker />
      </div>
    </div>
    <atlas-field-error [control]="formGroup().get(controlNameTo())" />
  </div>
</div>
