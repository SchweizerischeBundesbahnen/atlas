spring:
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5444/timetable-hearing?currentSchema=timetable_hearing
    username: user
    password: pwd
    driver-class-name: org.postgresql.Driver
    lidi:
      url: jdbc:postgresql://localhost:5433/line-directory?currentSchema=line_directory
      username: user
      password: pwd
      driver-class-name: org.postgresql.Driver
    workflow:
      url: jdbc:postgresql://localhost:5438/workflow
      username: user
      password: pwd
      driver-class-name: org.postgresql.Driver
  application:
    name: timetable-hearing
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jmx:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8666/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/v2.0
      client:
        provider:
          atlasAdmin:
            issuer-uri: http://localhost:8666/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/v2.0
        registration:
          atlasAdmin:
            authorization-grant-type: client_credentials
            client-id: ${SCHEDULING_CLIENT_ID}
            client-secret: ${SCHEDULING_CLIENT_SECRET}
            scope:
              - api://87e6e634-6ba1-4e7a-869d-3348b4c3eafc/.default
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      properties:
        spring:
          json:
            trusted:
              packages: "*"
        max:
          poll:
            interval:
              ms: 1200000
    producer:
      properties:
        max:
          request:
            size: 3000000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 1

kafka:
  atlas:
    mail:
      topic: atlas.mail
      groupId: atlas.kafka.mail.groupId
    user:
      administration:
        topic: atlas.user.administration
        groupId: atlas.kafka.tth.user.administration.groupId
    transport:
      company:
        topic: atlas.transport.company
        groupId: atlas.kafka.tth.transport.company.groupId

mail:
  workflow:
    stop-point:
      from: no-reply-atlas@sbb.ch

auth:
  audience:
    service-name: 87e6e634-6ba1-4e7a-869d-3348b4c3eafc
server:
  port: 8082
  tomcat:
    accesslog:
      enabled: false
      # write access logs to stdout
      directory: /dev
      prefix: stdout
      suffix:
      file-date-format:
      buffered: false
      pattern: combined
  error:
    include-message: always
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, metrics
info:
  app:
    name: timetable-hearing
    version: 1.0.0
    buildtime: ${time}
logging:
  level:
    root: INFO
    org.hibernate: ERROR
amazon:
  region: local
  bucketConfigs:
    hearing-documents:
      accessKey: NSVCQSGo2klxYXInNuob
      secretKey: jiiCYSlwdHBkrSg8J4Htqm7Ej8ydlprZGgYFwELc
      endpoint: "http://localhost:9000"
      forcePathStyle: true
      objectExpirationDays:

atlas:
  client:
    gateway:
      url: "http://localhost:8888"
