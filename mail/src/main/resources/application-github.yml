server:
  port: 8084
  tomcat:
    accesslog:
      enabled: false
      # write access logs to stdout
      directory: /dev
      prefix: stdout
      suffix:
      file-date-format:
      buffered: false
      pattern: combined
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

spring:
  cloud:
    vault:
      enabled: false
  application:
    name: mail
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8666/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/v2.0
  mail:
    host: smtp.freesmtpservers.com
    port: 25
    properties:
      mail:
        smtp:
          auth: none
          starttls:
            enable: true
auth:
  audience:
    service-name: 87e6e634-6ba1-4e7a-869d-3348b4c3eafc

logging:
  pattern:
    console: timestamp=%d thread=%t loglevel=%-5p class=%c appname=atlas traceid=%X{traceId} spanid=%X{spanId} message="%m"%n
